<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>接力吉尼 圖示 A — 踩著上一代的頭</title>
<style>html,body{margin:0;overflow:hidden;background:#121826}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 構圖: 幽靈(上一代的自己)站在平台上, 本尊踩在它頭頂 — 這款遊戲的核心動作。疊成一座高塔放正中。
(function () {
  var A = window.Art, P = A.palette;
  var cv = document.getElementById('c');
  // 幽靈畫兩層: 遊戲內單層 38% 不透明在小尺寸太淡, 疊兩層 ≈ 62%(= 開始畫面的幽靈濃度)
  function ghost(ctx, s) { A.drawGhost(ctx, s); A.drawGhost(ctx, s); }
  function draw() {
    var ctx = cv.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // 底: 遊戲夜色漸層(不透明)
    var g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, P.bgTop);
    g.addColorStop(1, P.bg);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);
    // 幽靈藍光暈(圓心偏上, 托住兩個角色)
    var r = ctx.createRadialGradient(256, 240, 0, 256, 240, 250);
    r.addColorStop(0, 'rgba(168,196,255,0.34)');
    r.addColorStop(0.55, 'rgba(168,196,255,0.12)');
    r.addColorStop(1, 'rgba(168,196,255,0)');
    ctx.fillStyle = r;
    ctx.fillRect(0, 0, 512, 512);
    // 角色組(世界座標 × 5.6): 平台頂 y 0、幽靈 y -28~0、本尊 y -56~-28
    var K = 5.6;
    ctx.save();
    ctx.translate(256, 384.8);
    ctx.scale(K, K);
    // 平台下的影子
    ctx.beginPath();
    ctx.ellipse(0, 0.5, 20, 2.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    A.drawPlatform(ctx, { x: -24, y: 0, w: 48, h: 10, solid: false });
    ghost(ctx, { x: -10, y: -28, facing: 1, state: 'idle', gen: 0, hookable: false, hookAir: true });
    A.drawPlayer(ctx, { x: -10, y: -56, facing: 1, state: 'idle', gen: 0 });
    ctx.restore();
    ctx.restore();
  }
  draw();
})();
</script>
</body>
</html>
