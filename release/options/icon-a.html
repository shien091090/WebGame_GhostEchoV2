<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>接力吉尼 圖示 A — 疊羅漢接力</title>
<style>body{margin:0;overflow:hidden;background:#121826}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 圖示 A: 遊戲核心「踩著上一代的自己往上」——幽靈跳起, 玩家站在它頭上, 一起離地。夜藍舞台。
(function () {
  var A = window.Art, C = A.palette;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 512, H = 512;

  function rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function glow(x, y, r, hex, a) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(hex, a));
    g.addColorStop(1, rgba(hex, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  ctx.save();
  // 背景: 遊戲的夜藍漸層 + 淡格線
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#24305a');
  g.addColorStop(1, C.bg);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (var gx = 0; gx <= W; gx += 64) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
  for (var gy = 0; gy <= H; gy += 64) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
  ctx.stroke();

  // 主體後方光暈(幽靈藍 + 奶白)
  glow(256, 250, 230, C.ghost, 0.32);
  glow(256, 150, 140, C.player, 0.18);

  // 世界層: 以 (256, 248) 為疊人中心, 放大 6 倍
  ctx.save();
  ctx.translate(256, 248);
  ctx.scale(6, 6);
  // 地面(滿版, 當背景用)
  A.drawPlatform(ctx, { x: -48, y: 38, w: 96, h: 24, solid: true });
  // 地上的影子: 兩個人一起離地
  ctx.beginPath();
  ctx.ellipse(0, 38, 8, 1.6, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  // 下: 上一代(幽靈, 跳起) / 上: 現在的你(站在它頭上)
  A.drawGhost(ctx, { x: -10, y: 0, facing: 1, state: 'air', hookable: false, hookAir: true });
  A.drawPlayer(ctx, { x: -10, y: -28, facing: 1, state: 'idle' });
  // 幽靈腳下兩道上升的速度線(幽靈藍)
  ctx.strokeStyle = rgba(C.ghostEdge, 0.7);
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-15, 22); ctx.lineTo(-15, 32);
  ctx.moveTo(15, 22); ctx.lineTo(15, 32);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
})();
</script>
</body>
</html>
