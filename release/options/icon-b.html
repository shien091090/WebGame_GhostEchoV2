<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>接力吉尼 圖示 B — 本尊特寫與兩層殘影</title>
<style>html,body{margin:0;overflow:hidden;background:#121826}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 構圖: 本尊放大到佔滿畫面的大頭特寫, 身後往左下拖兩層幽靈殘影(前兩代的自己), 金色光暈。
(function () {
  var A = window.Art, P = A.palette;
  var cv = document.getElementById('c');
  function draw() {
    var ctx = cv.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, P.bgTop);
    g.addColorStop(1, P.bg);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);
    // 終點金光暈(偏右上, 角色朝向的那一側)
    var r = ctx.createRadialGradient(300, 210, 0, 300, 210, 260);
    r.addColorStop(0, 'rgba(255,210,63,0.30)');
    r.addColorStop(0.5, 'rgba(255,210,63,0.10)');
    r.addColorStop(1, 'rgba(255,210,63,0)');
    ctx.fillStyle = r;
    ctx.fillRect(0, 0, 512, 512);
    // 角色組(世界 × 12.5): 第 1 代殘影(單層, 最淡) → 第 2 代殘影(兩層) → 本尊
    var K = 12.5;
    ctx.save();
    ctx.translate(293.5, 231);
    ctx.scale(K, K);
    var gs = { facing: 1, state: 'idle', gen: 0, hookable: false, hookAir: true };
    A.drawGhost(ctx, { x: -16, y: -10, facing: 1, state: 'idle', gen: 0, hookable: false, hookAir: true });
    gs.x = -13; gs.y = -12;
    A.drawGhost(ctx, gs);
    A.drawGhost(ctx, gs);
    A.drawPlayer(ctx, { x: -10, y: -14, facing: 1, state: 'idle', gen: 0 });
    ctx.restore();
    ctx.restore();
  }
  draw();
})();
</script>
</body>
</html>
