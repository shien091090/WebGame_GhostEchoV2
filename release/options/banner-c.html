<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>接力吉尼 橫幅 C — 翹翹板彈射</title>
<style>html,body{margin:0;overflow:hidden;background:#121826}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 構圖: 機關場景放左半 — 幽靈落在翹翹板的落點端, 本尊從發射端被彈上天、飛向左上高台的終點旗;
// 右半是標題, 標題下方一座亮起的升降台和踩下的壓板。左下角只有高台的磚牆與地面。
(function () {
  var A = window.Art, P = A.palette;
  var cv = document.getElementById('c');
  var FONT = '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
  var STROKE = 'rgba(8,10,18,0.9)';

  function title(ctx, cx, y1, s1, y2, s2) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.font = '900 ' + s1 + 'px "JJ Zen Maru Gothic", ' + FONT;
    ctx.fillStyle = 'rgba(168,196,255,0.15)';
    ctx.fillText('接力吉尼', cx - s1 * 0.15, y1 + s1 * 0.08);
    ctx.fillStyle = 'rgba(168,196,255,0.3)';
    ctx.fillText('接力吉尼', cx - s1 * 0.077, y1 + s1 * 0.04);
    ctx.lineWidth = s1 * 0.135;
    ctx.strokeStyle = STROKE;
    ctx.strokeText('接力吉尼', cx, y1);
    ctx.fillStyle = P.player;
    ctx.fillText('接力吉尼', cx, y1);
    ctx.font = 'bold ' + s2 + 'px "JJ Mochiy Pop One", ' + FONT;
    ctx.lineWidth = s2 * 0.25;
    ctx.strokeStyle = STROKE;
    ctx.strokeText('-Jelly Jinni-', cx, y2);
    ctx.fillStyle = P.ghost;
    ctx.fillText('-Jelly Jinni-', cx, y2);
    ctx.restore();
  }
  function arcPt(x0, y0, x1, y1, h, u) { return { x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u - 4 * h * u * (1 - u) }; }
  // 彈射軌跡: 鉤爪綠圓點(本尊彈射中用鉤爪色, 與遊戲內彈射外框同色), 只畫身後那段
  function trail(ctx, x0, y0, x1, y1, h, uEnd) {
    var n = 14;
    for (var i = 1; i < n; i++) {
      var u = i / n * uEnd, p = arcPt(x0, y0, x1, y1, h, u);
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(8,10,18,0.55)'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(166,255,77,' + (0.45 + 0.5 * u / uEnd) + ')'; ctx.fill();
    }
  }
  function ghost(ctx, s) { A.drawGhost(ctx, s); A.drawGhost(ctx, s); }
  function glow(ctx, x, y, rx, ry, col, a) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(1, ry / rx);
    var r = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    r.addColorStop(0, 'rgba(' + col + ',' + a + ')');
    r.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = r;
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    var ctx = cv.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = P.bg;
    ctx.fillRect(0, 0, 1680, 720);
    ctx.save(); ctx.scale(1680 / 853.3333, 1680 / 853.3333); A.drawBackground(ctx, {}); ctx.restore();
    glow(ctx, 1220, 280, 480, 220, '168,196,255', 0.20);   // 標題光暈
    glow(ctx, 700, 380, 420, 300, '166,255,77', 0.08);     // 彈射區淡綠光
    glow(ctx, 350, 200, 220, 160, '255,210,63', 0.18);     // 終點旗金光
    glow(ctx, 1180, 480, 220, 90, '54,214,231', 0.14);     // 升降台青光

    var F = 4;    // 世界 420 × 180; 地面頂 世界 165 = 畫面 660
    ctx.save();
    ctx.scale(F, F);
    A.drawPlatform(ctx, { x: -2, y: 165, w: 424, h: 17, solid: true });     // 地面
    A.drawPlatform(ctx, { x: 30, y: 75, w: 85, h: 90, solid: true });       // 終點高台(左下角只放它的磚牆)
    A.drawGoal(ctx, { x: 75, y: 35 });
    A.drawSeesaw(ctx, { x: 140, y: 159, tilt: 0.6, swing: 1, swinging: false });
    ghost(ctx, { x: 152, y: 134.5, facing: 1, state: 'idle', gen: 0, hookable: false, hookAir: true });   // 落在落點端的幽靈
    A.drawLift(ctx, { x: 265, y: 120, active: true });
    A.drawPlate(ctx, { x: 345, y: 159, pressed: true, kind: 'lift' });
    ctx.restore();

    // 本尊: 從發射端(880, 618)被彈起, 飛向高台(380, 300), 畫在 u = 0.38
    var X0 = 880, Y0 = 618, X1 = 380, Y1 = 300, H = 230, U = 0.38;
    trail(ctx, X0, Y0, X1, Y1, H, U - 0.07);
    var p = arcPt(X0, Y0, X1, Y1, H, U);
    ctx.save();
    ctx.scale(F, F);
    A.drawPlayer(ctx, { x: p.x / F - 10, y: p.y / F - 28, facing: -1, state: 'launch', gen: 0 });
    ctx.restore();

    title(ctx, 1220, 232, 150, 360, 60);
    ctx.restore();
  }
  draw();
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('900 150px "JJ Zen Maru Gothic"', '接力吉尼'),
        document.fonts.load('bold 60px "JJ Mochiy Pop One"', '-Jelly Jinni-')
      ]).then(draw, function () {});
    }
  } catch (e) { /* 略過 */ }
})();
</script>
</body>
</html>
