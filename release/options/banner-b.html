<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>接力吉尼 橫幅 B — 幽靈疊高塔</title>
<style>html,body{margin:0;overflow:hidden;background:#121826}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 構圖: 標題放左半; 右半是兩代幽靈疊成的塔, 本尊從塔頂一躍飛向高台上的終點旗, 腳下是尖刺坑。
(function () {
  var A = window.Art, P = A.palette;
  var cv = document.getElementById('c');
  var FONT = '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
  var STROKE = 'rgba(8,10,18,0.9)';

  function title(ctx, cx, y1, s1, y2, s2) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.font = '900 ' + s1 + 'px "JJ Zen Maru Gothic", ' + FONT;
    ctx.fillStyle = 'rgba(168,196,255,0.15)';
    ctx.fillText('接力吉尼', cx - s1 * 0.15, y1 + s1 * 0.08);
    ctx.fillStyle = 'rgba(168,196,255,0.3)';
    ctx.fillText('接力吉尼', cx - s1 * 0.077, y1 + s1 * 0.04);
    ctx.lineWidth = s1 * 0.135;
    ctx.strokeStyle = STROKE;
    ctx.strokeText('接力吉尼', cx, y1);
    ctx.fillStyle = P.player;
    ctx.fillText('接力吉尼', cx, y1);
    ctx.font = 'bold ' + s2 + 'px "JJ Mochiy Pop One", ' + FONT;
    ctx.lineWidth = s2 * 0.25;
    ctx.strokeStyle = STROKE;
    ctx.strokeText('-Jelly Jinni-', cx, y2);
    ctx.fillStyle = P.ghost;
    ctx.fillText('-Jelly Jinni-', cx, y2);
    ctx.restore();
  }
  function arcPt(x0, y0, x1, y1, h, u) { return { x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u - 4 * h * u * (1 - u) }; }
  // 接力虛線弧, 只畫 u 0 ~ uEnd 那一段(角色身後的軌跡)
  function arc(ctx, x0, y0, x1, y1, h, uEnd) {
    var n = 16;
    for (var i = 1; i < n; i++) {
      var u = i / n * uEnd, p = arcPt(x0, y0, x1, y1, h, u);
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(8,10,18,0.55)'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(168,196,255,0.9)'; ctx.fill();
    }
  }
  function ghost(ctx, s) { A.drawGhost(ctx, s); A.drawGhost(ctx, s); }
  function glow(ctx, x, y, rx, ry, col, a) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(1, ry / rx);
    var r = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    r.addColorStop(0, 'rgba(' + col + ',' + a + ')');
    r.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = r;
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    var ctx = cv.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = P.bg;
    ctx.fillRect(0, 0, 1680, 720);
    ctx.save(); ctx.scale(1680 / 853.3333, 1680 / 853.3333); A.drawBackground(ctx, {}); ctx.restore();
    glow(ctx, 540, 300, 520, 240, '168,196,255', 0.20);    // 標題光暈
    glow(ctx, 1500, 230, 300, 220, '255,210,63', 0.20);    // 終點旗金光
    // 尖刺坑底的暗紅警示(遊戲內坑底的畫法)
    var pg = ctx.createLinearGradient(0, 560, 0, 720);
    pg.addColorStop(0, 'rgba(255,77,77,0)');
    pg.addColorStop(1, 'rgba(255,77,77,0.26)');
    ctx.fillStyle = pg;
    ctx.fillRect(600, 560, 480, 160);

    var F = 4;    // 世界 420 × 180; 地面頂 世界 160 = 畫面 640
    ctx.save();
    ctx.scale(F, F);
    A.drawPlatform(ctx, { x: -2, y: 160, w: 152, h: 22, solid: true });     // 左側地面(左下角只有地)
    A.drawSpike(ctx, { x: 150, y: 168, w: 120 });                            // 坑裡的尖刺
    A.drawPlatform(ctx, { x: 270, y: 160, w: 76, h: 22, solid: true });      // 塔底地面
    A.drawPlatform(ctx, { x: 346, y: 85, w: 76, h: 97, solid: true });       // 終點高台
    A.drawGoal(ctx, { x: 362, y: 45 });
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.ellipse(300, 160.5, 9, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    ghost(ctx, { x: 290, y: 132, facing: 1, state: 'idle', gen: 0, hookable: false, hookAir: true });   // 第 1 代
    ghost(ctx, { x: 290, y: 104, facing: 1, state: 'idle', gen: 0, hookable: false, hookAir: true });   // 第 2 代
    ctx.restore();

    // 本尊: 從第 2 代頭頂(1200, 416)跳向高台(1440, 340), 畫在弧的 u = 0.45 處
    var X0 = 1200, Y0 = 416, X1 = 1440, Y1 = 340, H = 190, U = 0.45;
    arc(ctx, X0, Y0, X1, Y1, H, U - 0.06);
    var p = arcPt(X0, Y0, X1, Y1, H, U);
    ctx.save();
    ctx.scale(F, F);
    A.drawPlayer(ctx, { x: p.x / F - 10, y: p.y / F - 28, facing: 1, state: 'air', gen: 0 });
    ctx.restore();

    title(ctx, 540, 262, 160, 398, 64);
    ctx.restore();
  }
  draw();
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('900 160px "JJ Zen Maru Gothic"', '接力吉尼'),
        document.fonts.load('bold 64px "JJ Mochiy Pop One"', '-Jelly Jinni-')
      ]).then(draw, function () {});
    }
  } catch (e) { /* 略過 */ }
})();
</script>
</body>
</html>
